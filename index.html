<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>드로잉 스튜디오</title>
<style>
:root{--bg:#232326;--pn:#2f2f34;--p2:#3a3b42;--ln:#44454d;--tx:#e9e9ee;--dm:#a4a5af;--ac:#7c8cff;--st:#1b1c20}
:root.light{--bg:#e9eaee;--pn:#f6f6f8;--p2:#e4e5ea;--ln:#c9cad2;--tx:#222;--dm:#666;--ac:#4c5cff;--st:#c9cbd3}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:13px system-ui,"Malgun Gothic",sans-serif;overflow:hidden}
#app{display:grid;grid-template-columns:52px 1fr;grid-template-rows:auto 1fr;height:100%}
header{grid-column:1/3;display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:4px 8px;background:var(--pn);border-bottom:1px solid var(--ln)}
button,select,input{font:inherit;color:var(--tx)}
button,select{background:var(--p2);border:1px solid var(--ln);border-radius:6px;padding:5px 8px;cursor:pointer}
button:hover{border-color:var(--ac)}button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
input[type=number],input[type=text]{background:var(--p2);border:1px solid var(--ln);border-radius:6px;padding:4px 6px;width:100%;min-width:0}
#tools{background:var(--pn);border-right:1px solid var(--ln);display:flex;flex-direction:column;gap:4px;padding:6px;overflow-y:auto}
#tools button{padding:7px 0;font-size:16px}
#stage{position:relative;overflow:hidden;background:var(--st);touch-action:none;cursor:crosshair}
#board{position:absolute;left:0;top:0;transform-origin:0 0;box-shadow:0 6px 30px rgba(0,0,0,.5)}
#board canvas{position:absolute;left:0;top:0;pointer-events:none}
aside{background:var(--pn);border-left:1px solid var(--ln);padding:8px;overflow-y:auto}
details{border-bottom:1px solid var(--ln);padding:6px 0}summary{cursor:pointer;font-weight:600}
details>*:not(summary){margin-top:6px}
label{display:flex;align-items:center;gap:6px;color:var(--dm)}label>span{width:64px;flex:none}label input[type=range]{flex:1;min-width:0}
.r{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
#sv,#hue{width:100%;display:block;border-radius:6px;touch-action:none}#hue{height:16px}
#sw,#rc{display:flex;flex-wrap:wrap;gap:4px}#sw button,#rc button{width:22px;height:22px;padding:0;border-radius:5px}
.ly{display:flex;gap:6px;padding:5px;border:1px solid var(--ln);border-radius:6px;margin-bottom:3px;cursor:pointer;background:var(--p2)}.ly.on{border-color:var(--ac)}.ly b{font-weight:400;width:18px;text-align:center}
#ll{max-height:200px;overflow-y:auto}
#stage.rotmode{cursor:grab}
.pickfx{position:fixed;width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.6),0 4px 14px rgba(0,0,0,.4);transform:translate(-50%,-50%) scale(.4);opacity:0;pointer-events:none;z-index:9995;transition:transform .18s ease-out,opacity .18s ease-out}
.pickfx.go{transform:translate(-50%,-50%) scale(1);opacity:1}
.pickfx b{position:absolute;top:40px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:2px 6px;border-radius:5px;font-size:11px;white-space:nowrap;font-weight:400}
#szc{position:fixed;border:1.5px solid #fff;border-radius:50%;pointer-events:none;display:none;z-index:9990;transform:translate(-50%,-50%);box-shadow:0 0 0 1px rgba(0,0,0,.7),inset 0 0 0 1px rgba(0,0,0,.7)}
#tip{position:fixed;display:none;background:#111;color:#fff;padding:5px 9px;border-radius:6px;font-size:12px;z-index:99999;pointer-events:none;max-width:280px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
#tools button{position:relative}.gm{position:absolute;right:3px;bottom:1px;font-size:8px;font-style:normal;opacity:.7}
#fly,#fm{position:fixed;display:none;background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:6px;z-index:9000;flex-direction:column;gap:4px;box-shadow:0 8px 28px rgba(0,0,0,.45)}
#fly button{text-align:left;display:flex;gap:8px;align-items:center}#fly .fg{width:20px;text-align:center}#fly i{margin-left:auto;font-style:normal;color:var(--dm);font-size:11px}
#fm{width:200px}#fm .fl{display:flex;flex-direction:column;gap:4px}#fm .fl button{text-align:left}
#kd,#cd,#nd,#lv{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:9800}
.cb{background:var(--pn);border:1px solid var(--ln);border-radius:12px;width:min(340px,92vw);padding:18px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.cb p{margin:0 0 16px;line-height:1.5}
.cb .r{justify-content:flex-end}
.cb button{padding:7px 14px}
.cb input[type=text]{width:100%;margin-bottom:14px}
.cb .r3{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.cb .r3 button{flex:none}
#lv .cdc{background:none;border:0;color:var(--dm);text-decoration:underline;padding:7px 4px}
.kb{background:var(--pn);border:1px solid var(--ln);border-radius:12px;width:min(440px,94vw);max-height:84vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.kb>.kh{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--ln)}
#kl{overflow-y:auto;padding:8px 14px}.kr{display:flex;align-items:center;gap:6px;padding:3px 0}.kr span{flex:1}.kr .kk{min-width:110px}.kr .kk.cap{background:var(--ac);color:#fff}
.kb>.kf{padding:10px 14px;border-top:1px solid var(--ln);display:flex;justify-content:space-between;gap:6px;align-items:center;color:var(--dm)}
#home{position:fixed;inset:0;background:var(--bg);z-index:9600;display:none;flex-direction:column;overflow-y:auto}
#home.show{display:flex}
#home .hh{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid var(--ln)}
#home .hb{padding:20px 24px;max-width:1000px;margin:0 auto;width:100%}
#home h2{margin:22px 0 10px}
.ncard{background:var(--p2);border:1px solid var(--ln);border-radius:10px;padding:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.ncard label{display:flex;flex-direction:column;gap:4px;color:var(--dm);font-size:11px}
.ncard input{width:80px}
#glib{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:6px}
.gc{background:var(--p2);border:1px solid var(--ln);border-radius:10px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.gc:hover{border-color:var(--ac)}
.gc .th{aspect-ratio:1.6;background:repeating-conic-gradient(#4a4b52 0 25%,#3c3d43 0 50%) 0 0/16px 16px;display:flex;align-items:center;justify-content:center}
.gc .th img{max-width:100%;max-height:100%;display:block}
.gc .gi{padding:8px;display:flex;flex-direction:column;gap:3px}
.gc .gn{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:none;border:none;color:var(--tx);padding:0;width:100%;text-align:left}
.gc .gd{font-size:10px;color:var(--dm)}
.gc .ga{display:flex;gap:4px;padding:0 8px 8px}
.gc .ga button{flex:1;padding:3px 0;font-size:11px}
#home .empty{color:var(--dm);padding:20px 0}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#3b3f5c;color:#fff;padding:9px 14px;border-radius:8px;display:none;z-index:99999}
.hg{display:flex;align-items:center;gap:4px;padding:0 8px;border-left:1px solid var(--ln)}
.pnl{position:fixed;width:264px;background:var(--pn);border:1px solid var(--ln);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.45);display:none;flex-direction:column;max-height:calc(100vh - 70px);z-index:100}
#lyb{position:relative}#lyb b{position:absolute;top:-4px;right:-4px;background:var(--ac);color:#fff;border-radius:8px;font-size:9px;padding:0 4px;font-style:normal}
@media(max-width:760px){
 .pnl{left:0!important;right:0;top:auto!important;bottom:0;width:100%;max-height:66vh;border-radius:14px 14px 0 0;z-index:5000}
 .pnl .ph{cursor:default;padding:10px 12px}
 #p-layer.show{z-index:5100}
 header{padding:6px}
 header b:first-child{display:none}
 .hg{padding:0 4px}
}
.pnl.show{display:flex}
.ph{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;cursor:grab;font-weight:600;border-bottom:1px solid var(--ln);touch-action:none;user-select:none}
.ph button{padding:0 7px;border:0;background:none;font-size:15px}
.pb{padding:8px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.pnl.cl .pb{display:none}.pnl.cl .ph{border-bottom:0}
#pm{position:fixed;display:none;background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:8px;z-index:9000;flex-direction:column;gap:6px;box-shadow:0 8px 28px rgba(0,0,0,.45)}
#txw{position:fixed;z-index:9500;transform-origin:0 0}
#txe{display:block;min-width:200px;background:rgba(255,255,255,.14);border:1px dashed var(--ac);outline:none;resize:none;padding:0;margin:0;overflow:hidden;white-space:pre;font-family:inherit}
.ly.folder{background:var(--p2);font-weight:600;gap:4px}
.ly.sub{margin-left:16px}
.ly select.fpick{margin-left:auto;font-size:10px;padding:2px 3px;width:78px;flex:none}
.ly .fx{margin-left:4px}
#huew{display:none}
</style></head><body>
<div id="app">
<header>
<b>드로잉 스튜디오</b>
<span class="hg"><button id="hU" title="되돌리기 Ctrl+Z">↶</button><button id="hR" title="다시 실행 Ctrl+Y">↷</button></span>
<span class="hg"><button id="fmb" title="필터 모음: 블러, 노이즈, 모자이크 등 (선택 영역이 있으면 그 안에만 적용)">필터 ▾</button></span>
<span class="hg"><button id="zO" title="축소">－</button><button id="zV" title="100%">100%</button><button id="zI" title="확대">＋</button><button id="rD" title="켜면 캔버스를 눌러 끌어서 마우스 방향대로 화면을 돌릴 수 있어요">↻</button><button id="rZ" title="회전을 기본값(0°)으로">0°</button><button id="fT" title="화면에 맞추기">⤢</button><button id="sy" title="대칭자(좌우 대칭으로 그리기)">⇋</button><input type="number" id="symN" min="1" max="16" value="1" title="방사형 대칭 축 수 (1=없음)" style="width:46px"></span>
<span class="hg"><button id="hS" title="프로젝트 저장 Ctrl+S">저장</button><button id="hO">열기</button><select id="ef"><option value="png">PNG</option><option value="jpeg">JPG</option><option value="webp">WEBP</option></select><button id="hE">내보내기</button></span>
<span class="hg"><button id="lyb" title="레이어 패널 열기/닫기">🗂 레이어</button><button id="hmb" title="보관함: 새 캔버스 만들기, 저장된 작업 열기">🗄 보관함</button><button id="pmb" title="다른 패널 보이기/숨기기, 기본 배치">패널 ▾</button><button id="th" title="다크/라이트">🌙</button><button id="kb" title="설정: 단축키 바꾸기">⚙</button></span>
<span id="ps" style="margin-left:auto;color:var(--dm);cursor:pointer" title="펜이 '마우스'로 뜨면 태블릿 드라이버에서 Windows Ink를 켜세요">입력: -</span>
<input type="file" id="fi" accept=".json,.dproj" hidden>
<div id="cd"><div class="cb"><p id="cdm"></p><div class="r"><button id="cdn">취소</button><button id="cdy" class="on">삭제</button></div></div></div>
<div id="nd"><div class="cb"><p>이름을 입력하세요</p><input type="text" id="ndi" maxlength="60"><div class="r"><button id="ndc">취소</button><button id="ndo" class="on">저장</button></div></div></div>
<div id="lv"><div class="cb"><p id="lvm">지금까지 그린 내용을 저장할까요?</p><div class="r3"><button id="lvx" class="cdc">계속 편집</button><button id="lvd">삭제(저장 안 함)</button><button id="lva">다른 이름으로 저장</button><button id="lvs" class="on">저장</button></div></div></div>
</header>
<div id="tools"></div>
<div id="stage"><div id="board"></div></div>
<section class="pnl" id="p-brush"><div class="ph"><span>브러시</span><span><button class="pc" title="접기/펴기">▾</button><button class="px" title="닫기">×</button></span></div><div class="pb">
<div class="r"><select id="bs" style="flex:1"></select><button id="bsv" title="현재 설정을 사용자 브러시로 저장">＋저장</button></div>
<label><span id="szl">펜 크기</span><input type="range" id="sz" min="1" max="1000" value="14"><input type="number" id="szn" min="1" max="1000" value="14" style="width:56px"></label>
<label><span>불투명도</span><input type="range" id="bo" min="1" max="100" value="100"></label>
<label><span>농도</span><input type="range" id="bf" min="1" max="100" value="100"></label>
<label><span>간격</span><input type="range" id="bp" min="2" max="100" value="8"></label>
<label><span>경도</span><input type="range" id="bh" min="0" max="100" value="100"></label>
<label><span>질감</span><input type="range" id="bt" min="0" max="100" value="0"></label>
<label><span>흔들림 보정</span><input type="range" id="sm" min="0" max="100" value="30"></label>
<label><span>필압 감도</span><input type="range" id="pn" min="0" max="100" value="50"></label>
<div class="r"><label><input type="checkbox" id="bk"> 펜 기울기</label><label><input type="checkbox" id="bv"> 속도</label></div>
</div></section>
<section class="pnl" id="p-color"><div class="ph"><span>색상</span><span><button class="pc" title="접기/펴기">▾</button><button class="px" title="닫기">×</button></span></div><div class="pb">
<div class="r" style="justify-content:space-between"><span style="color:var(--dm)">색상</span><button id="wtog" title="색상환으로 보기">⬡</button></div>
<canvas id="sv" width="240" height="140"></canvas><canvas id="hue" width="240" height="16"></canvas><canvas id="huew" width="180" height="180"></canvas>
<div class="r"><input type="text" id="hx" value="#1f2233" style="width:86px"><input type="number" id="cr" min="0" max="255" style="width:52px"><input type="number" id="cg" min="0" max="255" style="width:52px"><input type="number" id="cb" min="0" max="255" style="width:52px"></div>
<div class="r"><span style="color:var(--dm)">보조색</span><input type="color" id="c2" value="#ffffff"><button id="sw2" title="주색↔보조색 X">⇄</button><button id="asw">＋팔레트</button></div>
<div id="sw"></div><div style="color:var(--dm)">최근 색상</div><div id="rc"></div>
</div></section>
<section class="pnl" id="p-layer"><div class="ph"><span>레이어</span><span><button class="pc" title="접기/펴기">▾</button><button class="px" title="닫기">×</button></span></div><div class="pb"><div id="ll"></div>
<div class="r"><button id="la" title="추가">＋</button><button id="lf" title="폴더 추가">📁</button><button id="ld" title="복제">⧉</button><button id="lm" title="아래와 병합">⤓</button><button id="lx" title="삭제">🗑</button><button id="lu">▲</button><button id="lw">▼</button></div>
<button id="clipL" title="현재 레이어를 바로 아래 레이어의 모양에 맞춰 잘라요(되돌리기 가능)">📎 아래 레이어에 클리핑</button>
<label><span>불투명도</span><input type="range" id="lo" min="0" max="100"></label>
<label><span>혼합</span><select id="lb" style="flex:1"><option value="normal">통상</option><option value="multiply">곱하기</option><option value="screen">스크린</option><option value="overlay">오버레이</option><option value="darken">어둡게</option><option value="lighten">밝게</option><option value="color-dodge">색상 닷지</option><option value="color-burn">색상 번</option><option value="soft-light">소프트 라이트</option><option value="difference">차이</option></select></label>
<label><input type="checkbox" id="lal"> 투명 픽셀 잠금</label>
</div></section>
<section class="pnl" id="p-sel"><div class="ph"><span>선택 · 변형</span><span><button class="pc" title="접기/펴기">▾</button><button class="px" title="닫기">×</button></span></div><div class="pb">
<div class="r"><button id="sI">선택 반전</button><button id="sD">해제</button><button id="sF">색 채우기</button><button id="sC">선택 지우기</button></div>
<label><span>매직완드 허용치</span><input type="number" id="wtol" value="24" min="0" max="255" style="width:64px"></label>
<div class="r"><button id="xI">확대</button><button id="xO">축소</button><button id="xL">↺ 회전</button><button id="xR">↻ 회전</button></div>
<div style="color:var(--dm)">이동 도구(✥)로 레이어를 끌어 옮겨요</div>
</div></section>
<section class="pnl" id="p-text"><div class="ph"><span>텍스트</span><span><button class="pc" title="접기/펴기">▾</button><button class="px" title="닫기">×</button></span></div><div class="pb">
<div class="r"><select id="tf" style="flex:1"><option>sans-serif</option><option>serif</option><option>monospace</option><option>cursive</option></select><input type="number" id="ts" value="48" style="width:64px"></div>
<div class="r"><label><input type="checkbox" id="tb"> 굵게</label><label><input type="checkbox" id="ti"> 기울임</label><label><input type="checkbox" id="to"> 외곽선</label><label><input type="checkbox" id="td"> 그림자</label></div>
<label><span>자간</span><input type="range" id="tl" min="-5" max="30" value="0"></label><label><span>행간</span><input type="range" id="th2" min="80" max="250" value="120"></label>
<div style="color:var(--dm)">T 도구로 캔버스를 누르면 그 자리에서 바로 글을 써요 (외곽선은 보조색)</div>
</div></section>
<section class="pnl" id="p-canvas"><div class="ph"><span>캔버스</span><span><button class="pc" title="접기/펴기">▾</button><button class="px" title="닫기">×</button></span></div><div class="pb">
<div class="r"><input type="number" id="nw" value="1600" style="width:70px"><input type="number" id="nh" value="1000" style="width:70px"><input type="number" id="nd" value="72" style="width:56px" title="DPI"></div>
<label><input type="checkbox" id="nt"> 투명 배경</label><div class="r"><button id="nb">새 캔버스</button><button id="cs" title="선택 영역 크기로 자르기">자르기</button><button id="fh">좌우 반전</button><button id="fv">상하 반전</button></div>
</div></section>
<div id="pm"></div></div><div id="home"><div class="hb">
<div class="hh"><b style="font-size:16px">드로잉 스튜디오 · 보관함</b><button id="hmx">편집으로 돌아가기 ✕</button></div>
<h2>새 캔버스 만들기</h2>
<div class="ncard">
<label>가로<input type="number" id="hw" value="1600"></label>
<label>세로<input type="number" id="hh" value="1000"></label>
<label>DPI<input type="number" id="hd" value="72"></label>
<label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" id="ht" style="width:auto"> 투명 배경</label>
<button id="hcreate">만들기</button>
</div>
<h2>저장된 작업</h2>
<div id="glib"></div>
</div></div>
<div id="szc"></div>
<div id="fly"></div><div id="fm"><label><span>강도</span><input type="range" id="fa" min="1" max="50" value="8"><em id="fav">8</em></label><div class="fl"></div></div><div id="kd"><div class="kb"><div class="kh"><b>설정 · 단축키</b><button id="kx">닫기</button></div><div id="kl"></div><div class="kf"><span>버튼을 누른 뒤 새 키를 누르세요 (Esc 취소)</span><button id="kr">기본값으로</button></div></div></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);let W=1600,H=1000,dpi=72;

 const done=v=>{$('#nd').style.display='none';$('#ndo').onclick=null;$('#ndc').onclick=null;$('#ndi').onkeydown=null;if(v!==null)onOk(v)};
 $('#ndo').onclick=()=>done($('#ndi').value.trim()||def);$('#ndc').onclick=()=>done(null);
 $('#ndi').onkeydown=e=>{if(e.key==='Enter')done($('#ndi').value.trim()||def);if(e.key==='Escape')done(null)}}
function doSave(cb){if(!curProj)return doSaveAs(cb);persist();dirty=false;toast('저장했어요');if(cb)cb()}
function doSaveAs(cb){askName(curProj?(idxGet().find(x=>x.id===curProj)||{}).name+' 사본':'제목 없음 '+(idxGet().length+1),name=>{curProj=newProject(name);dirty=false;toast('새 이름으로 저장했어요');if(cb)cb()})}
function guardLeave(next){if(!dirty)return next();
 $('#lv').style.display='flex';
 const done=()=>{$('#lv').style.display='none';$('#lvs').onclick=$('#lva').onclick=$('#lvd').onclick=$('#lvx').onclick=null};
 $('#lvs').onclick=()=>{done();doSave(next)};
 $('#lva').onclick=()=>{done();doSaveAs(next)};
 $('#lvd').onclick=()=>{done();dirty=false;next()};
 $('#lvx').onclick=()=>done();}
